{% extends "base.html" %}


{% block content %}

<h1>Produtos da Loja</h1>


<ul>

    {% for produto in produtos %}

    <li>

        {{ produto.nome }} - R$ {{ produto.preco }} - Estoque: {{ produto.estoque }}

    </li>

    {% empty %}

    <li>Nenhum produto cadastrado.</li>

    {% endfor %}

</ul>

{% endblock %}
